AutoName: MNDO
Summary: Decentralized, end-to-end encrypted messaging with Nostr & Signal Protocol
Description: |-
  MNDO is a peer-to-peer, decentralized, and zero-compromise privacy messaging application.
  It combines the censorship-resistant relay transport of the Nostr protocol with the
  cryptographically audited Signal Protocol (Double Ratchet + X3DH) for true End-to-End
  Encryption (E2EE).

  Key Features:
  * No phone numbers or emails required.
  * No central servers, telemetry, or user databases.
  * Sovereign cryptographic identity derived deterministically from a 12-word recovery phrase.
  * Encrypted storage at rest using SQLCipher 256-bit AES encryption.
  * Double Ratchet & X3DH PreKey session infrastructure with Forward Secrecy.
  * End-to-End encrypted voice notes (AES-256-GCM) with decentralized Blossom media storage.
  * Self-healing WebSocket transport architecture with jittered backoff.
  * Real-time presence indicators and focus-aware read receipts.

RepoType: git
